<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashain Tika Celebration E-Invitation</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh; overflow: hidden;
    background: radial-gradient(circle at 50% 35%, #f5eee3, #ecdfd0 100%);
    font-family: Georgia, "Times New Roman", serif;
  }
  .scene {
    position: relative; width: 100%; height: 100vh; height: 100dvh;
    display: grid; place-items: center; overflow: hidden; padding: 16px;
  }

  /* ---------- closed envelope ---------- */
  .envelope-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    transition: opacity .6s ease, transform .8s cubic-bezier(.4,0,.2,1);
  }
  .envelope-button {
    border: 0; padding: 0; background: transparent; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    animation: float 3.2s ease-in-out infinite;
    filter: drop-shadow(0 18px 22px rgba(75, 26, 26, .28));
  }
  .envelope-button img {
    display: block; width: auto; height: auto;
    max-width: min(88vw, 520px); max-height: calc(100dvh - 120px);
    border-radius: 4px; user-select: none; -webkit-user-drag: none;
  }
  .envelope-button:hover { animation-play-state: paused; transform: translateY(-4px) scale(1.015); }
  .envelope-button:focus-visible { outline: 3px solid #b51f2a; outline-offset: 6px; border-radius: 6px; }
  .hint {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: #7c1520; font-size: clamp(16px, 2.4vw, 21px);
    animation: pulse 1.8s ease-in-out infinite;
  }
  .hint svg { width: 38px; height: 38px; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

  /* ---------- opened invitation ---------- */
  .invitation {
    position: absolute; inset: 0; display: none; place-items: center; padding: 10px;
  }
  .invitation img {
    display: block; width: auto; height: auto;
    max-width: 100%; max-height: calc(100dvh - 20px);
    filter: drop-shadow(0 16px 30px rgba(75, 26, 26, .25));
    user-select: none; -webkit-user-drag: none;
  }
  .opened .envelope-wrap { opacity: 0; transform: scale(.9) translateY(30px); pointer-events: none; }
  .opened .envelope-wrap.gone { display: none; }
  .opened .invitation { display: grid; animation: rise 1s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(60px) scale(.9); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ---------- falling money + confetti ---------- */
  .fall-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  .fall-layer .piece {
    position: absolute; top: -90px; will-change: transform, opacity;
    animation: fall var(--dur) linear var(--delay) forwards;
  }
  .piece .sway { animation: sway var(--sway-dur) ease-in-out var(--delay) infinite alternate; }
  .piece .spin { animation: spin var(--spin-dur) linear var(--delay) infinite; transform-style: preserve-3d; }
  @keyframes fall { 0% { transform: translateY(0); opacity: 1; } 92% { opacity: 1; } 100% { transform: translateY(calc(100vh + 160px)); opacity: .9; } }
  @keyframes sway { from { transform: translateX(calc(var(--drift) * -1)); } to { transform: translateX(var(--drift)); } }
  @keyframes spin { from { transform: rotateX(0) rotateZ(var(--tilt)); } to { transform: rotateX(360deg) rotateZ(var(--tilt)); } }

  /* confetti bits */
  .bit { width: 9px; height: 14px; }

  /* dollar bill drawn in CSS */
  .bill {
    width: 74px; height: 34px; border-radius: 4px; position: relative;
    background: linear-gradient(135deg, #7fbf7a, #3f8f4c 55%, #2f7a3e);
    border: 2px solid #1f5f2d;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.28), 0 2px 6px rgba(0,0,0,.25);
    display: grid; place-items: center; color: #e9f7e4;
    font: 700 16px/1 Georgia, serif; text-shadow: 0 1px 0 rgba(0,0,0,.3);
  }
  .bill:before {
    content: ""; position: absolute; width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.55); background: rgba(255,255,255,.12);
  }
  .bill span { position: relative; z-index: 1; }
  .bill i { position: absolute; font-style: normal; font-size: 8px; color: rgba(255,255,255,.8); }
  .bill i.a { top: 2px; left: 5px; } .bill i.b { bottom: 2px; right: 5px; }
  .coin {
    width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff1b8, #e2b341 55%, #b9851d);
    border: 2px solid #f6dc8e; box-shadow: 0 2px 5px rgba(0,0,0,.3);
    display: grid; place-items: center; color: #8a5a0c; font: 700 15px/1 Georgia, serif;
  }

  @media (max-width: 520px) {
    .bill { width: 58px; height: 27px; font-size: 13px; }
    .bill:before { width: 20px; height: 20px; }
    .coin { width: 24px; height: 24px; font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .envelope-button, .hint { animation: none; }
    .fall-layer .piece, .piece .sway, .piece .spin { animation-duration: 6s; }
  }
</style>
</head>

<div class="fall-layer" id="fallLayer" aria-hidden="true"></div>

<script>
  (function () {
    var openButton = document.getElementById('openEnvelope');
    var scene = document.getElementById('scene');
    var wrap = document.getElementById('envelopeWrap');
    var layer = document.getElementById('fallLayer');
    var opened = false;

    var colors = ['#b51f2a', '#d6a63e', '#1b6045', '#f0c96a', '#f7e8bd', '#e76a35', '#8f101b'];
    function rnd(a, b) { return a + Math.random() * (b - a); }

    function makePiece(kind, delayMax) {
      var piece = document.createElement('div');
      piece.className = 'piece';
      var dur = kind === 'bit' ? rnd(3.2, 6) : rnd(4.2, 7.5);
      var delay = rnd(0, delayMax);
      piece.style.left = rnd(-2, 98) + 'vw';
      piece.style.setProperty('--dur', dur + 's');
      piece.style.setProperty('--delay', delay + 's');
      var sway = document.createElement('div');
      sway.className = 'sway';
      sway.style.setProperty('--drift', rnd(14, 70) + 'px');
      sway.style.setProperty('--sway-dur', rnd(1.2, 2.6) + 's');
      sway.style.setProperty('--delay', '0s');
      var spin = document.createElement('div');
      spin.className = 'spin';
      spin.style.setProperty('--spin-dur', rnd(1.4, 3.2) + 's');
      spin.style.setProperty('--tilt', rnd(-40, 40) + 'deg');
      spin.style.setProperty('--delay', '0s');
      var inner = document.createElement('div');
      if (kind === 'bill') {
        inner.className = 'bill';
        inner.innerHTML = '<i class="a">$</i><span>$</span><i class="b">$</i>';
      } else if (kind === 'coin') {
        inner.className = 'coin';
        inner.textContent = '$';
      } else {
        inner.className = 'bit';
        inner.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        inner.style.borderRadius = Math.random() > .5 ? '50%' : '1px';
      }
      spin.appendChild(inner); sway.appendChild(spin); piece.appendChild(sway);
      piece.addEventListener('animationend', function (e) {
        if (e.target === piece && piece.parentNode) piece.parentNode.removeChild(piece);
      });
      return piece;
    }

    function celebrate() {
      if (opened) return;
      opened = true;
      scene.classList.add('opened');
      setTimeout(function () { wrap.classList.add('gone'); }, 700);

      var frag = document.createDocumentFragment();
      var narrow = window.innerWidth < 520;
      var counts = { bill: narrow ? 26 : 42, coin: narrow ? 16 : 26, bit: narrow ? 90 : 150 };
      Object.keys(counts).forEach(function (kind) {
        for (var n = 0; n < counts[kind]; n++) frag.appendChild(makePiece(kind, 3.2));
      });
      layer.appendChild(frag);
    }

    openButton.addEventListener('click', celebrate);
  })();
</script>
